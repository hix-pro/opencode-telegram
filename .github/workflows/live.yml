name: Live tests

on:
  schedule:
    # Monday morning, before the working week. Scheduled workflows only run
    # from the default branch, never from a pull request.
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-tests
  cancel-in-progress: false

jobs:
  live:
    # Off until an operator registers the self-hosted runner and sets the
    # repository variable. See docs/LIVE_TESTING.md.
    if: vars.LIVE_TESTS_ENABLED == 'true'
    runs-on: [self-hosted, linux, opencode-live]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install runtime and test deps
        run: |
          python -m pip install --upgrade pip
          pip install requests==2.34.2 pytest==9.1.1
      - name: Live contract suite
        run: pytest -m live
