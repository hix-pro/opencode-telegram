name: Publish to PyPI

# Trusted publishing (OIDC): no API token is stored in this repository.
#
# One-time setup on PyPI:
#   Your projects -> Publishing -> Add a new pending publisher
#   PyPI project name: opencode-telegram
#   Owner: hix-pro
#   Repository: opencode-telegram
#   Workflow name: publish.yml
#   Environment name: pypi
#
# Then set the repository variable PYPI_PUBLISH=true and publish a GitHub
# release. Until then every release still builds and verifies the sdist and
# wheel, but nothing is uploaded.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: python -m pip install --upgrade pip build twine
      - run: python -m build
      - run: python -m twine check dist/*

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

      # The wheel and sdist are useful even while PyPI publishing is gated,
      # and a release should be installable from its own assets.
      - name: Attach packages to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/* --clobber

  publish:
    needs: build
    if: ${{ vars.PYPI_PUBLISH == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/opencode-telegram
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
