name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Pinned to the versions the pre-commit hook was verified against, so a
      # tool release cannot turn the public gate red without a repo change.
      - name: Install gate tooling
        run: |
          python -m pip install --upgrade pip
          pip install \
            requests==2.31.0 \
            ruff==0.16.0 \
            mypy==2.3.1 \
            types-requests \
            bandit==1.9.4 \
            pytest==9.1.1

      - name: Style (ruff)
        run: ruff check .

      - name: Types (mypy)
        run: mypy

      - name: Security scan (bandit)
        run: bandit -q -c pyproject.toml -r bridge.py bridgekit scripts

      - name: Offline test suite
        run: pytest
