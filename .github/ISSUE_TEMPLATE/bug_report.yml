name: Bug report
description: Something in the bridge does not behave as documented
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem. Do **not** paste bot
        tokens, OpenCode passwords, `.env` contents, or private keys. For a
        security issue, use the private advisory link instead of this form.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the actual behavior.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Minimal reproduction
      description: Commands or chat messages that trigger the problem.
      placeholder: |
        1. Send /...
        2. See ...
    validations:
      required: true
  - type: input
    id: bridge-version
    attributes:
      label: Bridge version
      description: Output of `/doctor` or the release tag.
      placeholder: v2.3.4
    validations:
      required: true
  - type: input
    id: opencode-version
    attributes:
      label: OpenCode version
      description: Output of `opencode --version`.
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: OS and Python
      placeholder: Ubuntu 24.04, Python 3.12.7
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Redact tokens, passwords, paths, and message text first.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I have redacted credentials and private data.
          required: true
        - label: I checked the README and existing issues.
          required: true
        - label: This is not a security vulnerability (those use private reporting).
          required: true
