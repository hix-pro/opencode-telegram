[project]
name = "opencode-bridge"
version = "2.2.1"
description = "Full remote control of a local OpenCode server from Telegram"
requires-python = ">=3.10"
dependencies = ["requests>=2.28"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not live'"
markers = [
    "live: needs a running OpenCode server; run with -m live",
]

[tool.ruff]
line-length = 95
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]