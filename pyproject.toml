[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "opencode-telegram"
version = "2.4.0"
description = "Full remote control of a local OpenCode server from Telegram"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "hix-pro" }]
keywords = ["opencode", "telegram", "remote-control", "coding-agent", "local-first"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: User Interfaces",
]
dependencies = ["requests>=2.34.2"]

[project.urls]
Homepage = "https://github.com/hix-pro/opencode-telegram"
Documentation = "https://github.com/hix-pro/opencode-telegram#readme"
Issues = "https://github.com/hix-pro/opencode-telegram/issues"
Changelog = "https://github.com/hix-pro/opencode-telegram/blob/master/CHANGELOG.md"

[project.scripts]
opencode-telegram = "bridge:main"

[tool.setuptools]
py-modules = ["bridge"]

[tool.setuptools.packages.find]
include = ["bridgekit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not live'"
markers = [
    "live: needs a running OpenCode server; run with -m live",
]

[tool.ruff]
line-length = 95
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
# The type gate over the shipped surface (bridge, library, ops scripts).
# Tests are deliberately excluded: they build object graphs mypy would
# want runtime asserts for, and none of it ships.
files = ["bridge.py", "bridgekit", "scripts"]
show_error_codes = true

[tool.bandit]
# The hook scans the shipped surface explicitly:
#   bandit -c pyproject.toml -r bridge.py bridgekit scripts
# The `targets` key is NOT honored by bandit for pyproject files (an observed
# fact, not an opinion: a full-repo run with targets set still scanned
# tests/), which is why the hook names the paths itself. exclude_dirs keeps
# ad-hoc repo-wide runs honest too. The accepted findings - the STT
# shell=True and the watchdog's fixed-argv subprocess calls - stay suppressed
# inline with `# nosec` comments documenting why, so the gate scans clean
# without a blanket skip.
exclude_dirs = ["tests", ".backup", "backups"]